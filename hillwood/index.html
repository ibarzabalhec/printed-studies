<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
</head>
<body>
<title>Hillwood: Printed Study</title>
<meta name="description" content="A guided study of what Hillwood builds, and its printed version.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#FFFFFF; --paper2:#FAFAFA; --paper3:#F2F2F2;
  --ink:#111111; --ink2:#3D3D3D; --ink3:#6B6B6B; --ink4:#767676;
  --rule:#E4E4E4; --rule2:#CFCFCF; --orange:#FF4F00;
  --sky:#FFFFFF; --sky2:#F2F2F1; --ground:#EDECEA; --ground2:#E6E5E2;
  --stone:#D2C6B1; --stoneDark:#8E806A; --stoneLine:#7B6D58;
  --plain:#D2D5D9; --water:#E1E6E8; --shadow:#000000; --hole:#1A1A1A;
  --pill:#767676; --pillInk:#FFFFFF;
  --grainOp:.05; --grainBlend:multiply;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1012; --paper2:#15161A; --paper3:#1D1F23;
    --ink:#ECECEC; --ink2:#C9C9C9; --ink3:#9D9D9D; --ink4:#909090;
    --rule:#2A2C31; --rule2:#3D4046;
    --sky:#0F1012; --sky2:#15161A; --ground:#1A1B1F; --ground2:#131417;
    --stone:#8C7D66; --stoneDark:#3A3229; --stoneLine:#B39F83;
    --plain:#3E4248; --water:#1A1E20; --shadow:#000000; --hole:#050505;
    --pill:#333333; --pillInk:#F2F2F2;
    --grainOp:.05; --grainBlend:screen;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1012; --paper2:#15161A; --paper3:#1D1F23;
  --ink:#ECECEC; --ink2:#C9C9C9; --ink3:#9D9D9D; --ink4:#909090;
  --rule:#2A2C31; --rule2:#3D4046;
  --sky:#0F1012; --sky2:#15161A; --ground:#1A1B1F; --ground2:#131417;
  --stone:#8C7D66; --stoneDark:#3A3229; --stoneLine:#B39F83;
  --plain:#3E4248; --water:#1A1E20; --shadow:#000000; --hole:#050505;
  --pill:#333333; --pillInk:#F2F2F2;
  --grainOp:.05; --grainBlend:screen;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-stretch:100%;-webkit-font-smoothing:antialiased;font-size:15.5px;line-height:1.5}
body.showing{overflow:hidden;background:var(--sky)}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--orange);outline-offset:3px;border-radius:2px}
.two{letter-spacing:-.035em;font-weight:500;color:var(--ink3);margin:0;text-wrap:balance}
.two strong{color:var(--ink);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--pill);color:var(--pillInk);border-radius:999px;padding:5px 11px 4px;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;font-stretch:112%;white-space:nowrap;line-height:1.2}
.pill.o::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--orange)}
.mono{font-family:"IBM Plex Mono",Menlo,monospace;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);font-variant-numeric:tabular-nums}
.mono b{font-weight:500;color:var(--ink)}
.src{font-size:12px;color:var(--ink2);line-height:1.5}
.src a{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:var(--rule2)}
.src a:hover{text-decoration-color:var(--ink)}
.ext{display:inline-block;width:10px;height:10px;margin-left:3px;vertical-align:0}
.circ{appearance:none;background:transparent;border:1px solid var(--rule2);color:var(--ink);width:44px;height:44px;border-radius:50%;display:inline-grid;place-items:center;cursor:pointer;transition:border-color .3s ease,opacity .4s ease;flex:none}
.circ:hover{border-color:var(--ink)}
.circ svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.3}
.circ[disabled]{opacity:.25;cursor:default}
.lnk{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-weight:500;letter-spacing:-.01em}
.lnk .circ{width:34px;height:34px}
.lnk .circ svg{width:14px;height:14px}
.lnk:hover .circ{border-color:var(--ink)}

/* ---------- bar ---------- */
.bar{position:fixed;left:0;right:0;top:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 18px) max(16px,4vw) 14px;display:flex;align-items:center;justify-content:space-between;gap:16px;pointer-events:none}
.bar > *{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-stretch:118%;text-decoration:none;white-space:nowrap}
.brand i{width:9px;height:9px;background:var(--orange);display:inline-block}
.bar .right{display:flex;align-items:center;gap:14px}
.bar .tabs{display:flex;gap:6px}
.tab{appearance:none;border:1px solid var(--rule2);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px 5px;font:600 10.5px/1.2 Archivo,Arial,sans-serif;letter-spacing:.09em;text-transform:uppercase;font-stretch:112%;cursor:pointer;text-decoration:none}
.tab[aria-current="page"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.prog{position:fixed;left:0;right:0;top:0;height:2px;z-index:6;background:transparent}
.prog i{display:block;height:100%;width:0;background:var(--orange);transition:width .6s ease}
body:not(.showing) .prog{display:none}

.thm{appearance:none;width:34px;height:34px;border:1px solid var(--rule2);border-radius:2px;background:var(--paper);color:var(--ink);display:inline-grid;place-items:center;cursor:pointer;transition:transform .5s ease,border-color .3s ease;flex:none}
.thm:hover{border-color:var(--ink)}
.thm.spin{transform:rotate(180deg)}
.thm svg{width:16px;height:16px}
#wipe{position:fixed;inset:0;z-index:50;pointer-events:none;display:none}
#wipe .gr{position:absolute;left:0;right:0;bottom:0;height:0}
#wipe .bead{position:absolute;height:3px;width:30%;background:var(--orange);left:0}

/* ---------- show ---------- */
#show{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#grain{position:absolute;inset:0;pointer-events:none;opacity:var(--grainOp);mix-blend-mode:var(--grainBlend);background-size:180px 180px}
#panel{position:absolute;left:max(16px,4vw);right:max(16px,4vw);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);border-top:1px solid var(--rule2);padding-top:18px;display:grid;grid-template-columns:minmax(11rem,15rem) minmax(0,1fr) auto;gap:14px 40px;align-items:start;transition:opacity .45s ease}
#panel.hide{opacity:0}
#panel.instant{transition:none}
#panel .lc{display:flex;flex-direction:column;gap:12px;min-width:0;align-items:flex-start}
#panel .rc{display:flex;flex-direction:column;gap:16px;min-width:0;max-width:52rem}
#panel .nav{display:flex;gap:10px;align-self:end}
.cnt{font-family:"IBM Plex Mono",Menlo,monospace;font-size:12px;color:var(--ink2);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.line{font-size:clamp(22px,2.1vw + 8px,46px);line-height:1.1}
.titleL{font-size:clamp(34px,4.8vw + 6px,92px);line-height:.98}
.sub{font-size:clamp(16px,.9vw + 9px,21px);line-height:1.4;color:var(--ink2);margin:0;max-width:36em;letter-spacing:-.01em}
.dl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.dl li{display:block}
.dl li.k{display:flex;align-items:center;gap:8px}
.sw{width:16px;height:10px;display:inline-block;border:1px solid var(--ink3);flex:none}
.sw.p{background:repeating-linear-gradient(0deg,var(--stone) 0 2px,var(--stoneLine) 2px 3px)}
.sw.c{background:var(--plain)}
.rows{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.rows li{display:grid;grid-template-columns:10rem 1fr;gap:16px;padding:9px 0;border-top:1px solid var(--rule);font-size:15px;line-height:1.4;align-items:baseline}
.rows li:last-child{border-bottom:1px solid var(--rule)}
.rows .k{font-family:"IBM Plex Mono",Menlo,monospace;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.bars{display:flex;flex-direction:column;gap:14px}
.barr{display:grid;grid-template-columns:7rem 1fr;gap:16px;align-items:center}
.barr .v{font-size:clamp(20px,1.6vw + 6px,32px);font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.barr .trk{display:flex;flex-direction:column;gap:6px}
.barr .fill{height:14px;background:repeating-linear-gradient(0deg,var(--stone) 0 2px,var(--stoneLine) 2px 3px);border:1px solid var(--stoneLine)}
.barr .fill.il{background:transparent;border:1px dashed var(--ink3)}
.barr .t{font-size:13px;color:var(--ink2);line-height:1.4}
.act{color:var(--ink2);letter-spacing:.12em;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--ink);max-width:52rem}
.stat{padding:12px 16px 4px 0;display:flex;flex-direction:column;gap:6px}
.stat b{font-size:clamp(26px,1.8vw + 10px,38px);font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.stat .mono{font-size:10.5px;letter-spacing:.1em;line-height:1.35}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{padding:10px 10px 6px 0}}
.lg{appearance:none;background:transparent;border:0;padding:4px 2px;margin:0;font:inherit;color:inherit;display:inline-flex;gap:7px;align-items:center;cursor:pointer;border-radius:2px}
.lg:hover{color:var(--ink)}
.lg i{font-style:normal}
.tab.back{align-self:flex-start;margin-bottom:2px}
.legend{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink2)}
.legend li{display:flex;gap:7px;align-items:baseline}
.legend i{font-style:normal;font-family:"IBM Plex Mono",Menlo,monospace;font-size:10.5px;color:var(--ink);background:var(--orange);color:#111;border-radius:50%;width:22px;height:22px;display:inline-grid;place-items:center;line-height:1}
.note{font-size:12.5px;color:var(--ink2);margin:0}
.recs{margin:0;padding:10px 0 0;list-style:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px 16px;border-top:1px solid var(--rule2);max-width:52rem}
.recs li{display:flex;flex-direction:column;gap:3px;font-size:13px;line-height:1.35;color:var(--ink)}
.recs .mono{font-size:11px}
@media (max-width:760px){.recs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hint{font-family:"IBM Plex Mono",Menlo,monospace;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);white-space:nowrap;align-self:center}
#next.wait{opacity:.2}
#next.pulse{animation:pulse 1.6s ease-in-out 1}
@keyframes pulse{0%,100%{border-color:var(--rule2)}45%{border-color:var(--ink);transform:translateX(3px)}}

/* ---------- pages (home, fit) ---------- */
.page{padding:calc(env(safe-area-inset-top,0px) + 96px) max(16px,4vw) 80px;max-width:1320px;margin:0 auto}
.hero{display:grid;grid-template-columns:minmax(11rem,15rem) minmax(0,1fr);gap:16px 40px;padding-bottom:40px;border-bottom:1px solid var(--rule)}
.hero .two{font-size:clamp(36px,4.6vw + 4px,84px);line-height:.98}
.hero .sub{margin-top:18px}
.sec{display:grid;grid-template-columns:minmax(11rem,15rem) minmax(0,1fr);gap:12px 40px;padding:28px 0;border-bottom:1px solid var(--rule)}
.sec > .k{padding-top:4px}
.sec h2{font-size:clamp(22px,1.4vw + 10px,32px);letter-spacing:-.03em;font-weight:500;margin:0 0 14px;line-height:1.15}
.cards{display:flex;flex-direction:column}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 32px;padding:26px 0;border-top:1px solid var(--rule);align-items:end}
.crow:first-child{border-top:0;padding-top:0}
.crow h3{font-size:clamp(28px,2.4vw + 8px,48px);letter-spacing:-.035em;font-weight:500;margin:6px 0 6px;line-height:1}
.crow .acts{display:flex;flex-wrap:wrap;gap:12px 22px}
.strip{display:flex;flex-wrap:wrap;gap:6px 24px;margin-top:10px}
.tbl{width:100%;border-collapse:collapse}
.tbl td{padding:10px 12px 10px 0;border-top:1px solid var(--rule);vertical-align:top;font-size:15px;line-height:1.45}
.tbl tr:last-child td{border-bottom:1px solid var(--rule)}
.tbl td.k{width:13rem;font-family:"IBM Plex Mono",Menlo,monospace;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);padding-top:12px}
.tbl .n{display:block;color:var(--ink2);font-size:13px;margin-top:3px}
.tbl .s{white-space:nowrap}
.plist{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(18rem,1fr));gap:0 32px}
.plist li{padding:14px 0;border-top:1px solid var(--rule)}
.plist .nm{font-size:19px;font-weight:500;letter-spacing:-.02em}
.plist .ti{font-size:14px;color:var(--ink2);margin-top:2px}
.plist .no{font-size:13.5px;margin-top:6px}
.qlist{margin:0;padding:0;list-style:none;counter-reset:q}
.qlist li{counter-increment:q;display:grid;grid-template-columns:2.2rem 1fr;padding:10px 0;border-top:1px solid var(--rule);font-size:16px}
.qlist li::before{content:counter(q,decimal-leading-zero);font-family:"IBM Plex Mono",Menlo,monospace;font-size:12px;color:var(--ink2);padding-top:3px}
.lead{font-size:clamp(18px,.8vw + 12px,22px);line-height:1.45;letter-spacing:-.01em;max-width:44em;margin:0}
.callout{border-left:2px solid var(--orange);padding:4px 0 4px 16px;font-size:17px;line-height:1.45;max-width:46em;margin:0 0 16px}
.steps{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 28px}
@media (max-width:1100px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.steps{grid-template-columns:1fr}}
.steps li{border-top:1px solid var(--rule2);padding:14px 0}
.steps b{display:block;font-weight:500;font-size:17px;letter-spacing:-.02em;margin-bottom:4px}
.steps span{font-size:14px;color:var(--ink2)}
.foot{padding-top:28px;font-size:12.5px;color:var(--ink2)}
/* ---------- fit page: what printing adds ---------- */
.adds{list-style:none;margin:0;padding:0}
.add{display:grid;grid-template-columns:minmax(11rem,15rem) minmax(0,1fr);gap:12px 40px;padding:34px 0;border-bottom:1px solid var(--rule)}
.add .an{color:var(--orange);font-weight:500;padding-top:8px}
.add h2{font-size:clamp(24px,1.8vw + 10px,40px);line-height:1.06;margin:0}
.add .ad{font-size:17px;line-height:1.5;color:var(--ink2);margin:12px 0 0;max-width:44em}
.afig{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;align-items:baseline;margin-top:18px;border-top:1px solid var(--ink);padding-top:12px;max-width:52rem}
.afig b{font-size:clamp(26px,1.8vw + 10px,38px);font-weight:800;letter-spacing:-.04em;line-height:1;white-space:nowrap}
.afig span{font-size:15px;color:var(--ink2);line-height:1.4}
.afig .src{grid-column:1/-1}
.add .at{margin-top:24px;color:var(--ink)}
.heres{list-style:none;margin:8px 0 0;padding:0}
.here{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:6px 28px;padding:14px 0;border-top:1px solid var(--rule)}
.here .nm{font-family:"IBM Plex Mono",Menlo,monospace;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
.here .what{font-size:15px;line-height:1.45;color:var(--ink2);margin:4px 0 0}
.here .pr{font-size:clamp(17px,.6vw + 12px,20px);line-height:1.25;margin:0 0 8px;letter-spacing:-.02em;color:var(--ink3)}
.here .pr strong{color:var(--ink);font-weight:500}
.here .src{grid-column:1/-1}
.lnk.sm{font-size:14px}
@media (max-width:760px){.add{grid-template-columns:1fr;gap:8px;padding:26px 0}.here{grid-template-columns:1fr}.afig{grid-template-columns:1fr}}
/* ---------- older fit cards (unused) ---------- */
.fitg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:48px 40px;padding:36px 0 8px}
.fitc{display:flex;flex-direction:column;gap:16px;min-width:0}
.thumb{position:relative;display:block;aspect-ratio:16/10;border:1px solid var(--rule);background:var(--sky);overflow:hidden;text-decoration:none;color:inherit}
.thumb canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.thumb .play{position:absolute;right:12px;bottom:12px;display:inline-flex;align-items:center;gap:8px;font:600 10.5px/1.2 Archivo,Arial,sans-serif;letter-spacing:.09em;text-transform:uppercase;font-stretch:112%;background:var(--paper);border:1px solid var(--rule2);border-radius:999px;padding:6px 12px 5px 8px;transition:border-color .3s ease}
.thumb .play svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.5}
.thumb:hover .play{border-color:var(--ink)}
.fitt{display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(0,1.15fr);gap:14px;align-items:start}
.fitt .arw{padding-top:22px;color:var(--ink3)}
.fitt .arw svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.2}
.fitt .theirs,.fitt .printed{display:flex;flex-direction:column;gap:8px;min-width:0;align-items:flex-start}
.fitt .nm{font-family:"IBM Plex Mono",Menlo,monospace;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
.fitt .what{font-size:15px;line-height:1.4;color:var(--ink2);margin:0}
.fitt .pr{font-size:clamp(18px,.7vw + 12px,22px);line-height:1.2;margin:0}
.chips{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.chips li{font-family:"IBM Plex Mono",Menlo,monospace;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);border:1px solid var(--rule2);border-radius:999px;padding:4px 10px 3px;white-space:nowrap}
.fitc .src{margin-top:2px}
.acts2{display:flex;flex-wrap:wrap;gap:12px 26px;margin-top:24px}
.ico{width:16px;height:16px;flex:none}
@media (max-width:900px){.fitg{grid-template-columns:1fr;gap:40px}}
@media (max-width:560px){.fitt{grid-template-columns:1fr;gap:10px}.fitt .arw{display:none}.thumb{aspect-ratio:4/3}}

@media (max-width:760px){
  #panel{grid-template-columns:1fr;gap:10px;padding-top:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);max-height:calc(100% - env(safe-area-inset-top,0px) - 74px);overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain}
  #panel .lc{order:1;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 14px}
  #panel .rc{order:2;gap:10px}
  #panel .nav{order:3;justify-self:stretch;justify-content:flex-end;position:sticky;bottom:0;padding-top:8px}
  #panel.ovf .nav{background:linear-gradient(to bottom,rgba(0,0,0,0),var(--ground2) 45%)}
  #panel .stats .stat b{font-size:24px}#panel .stats .mono{font-size:10.5px}#panel .line{font-size:clamp(20px,5.6vw,26px)}
  .recs{gap:6px 14px;padding-top:8px}.recs li{font-size:12.5px}
  #panel .lc .dl{flex-direction:row;flex-wrap:wrap;gap:4px 14px}
  #panel .lc .src{display:none}
  #panel .rc .srcm{display:block}
  .rows li{grid-template-columns:1fr;gap:2px;font-size:14px;padding:7px 0}
  .hero,.sec{grid-template-columns:1fr}
  .crow{grid-template-columns:1fr}
  .tbl td.k{width:auto;display:block;border-top:1px solid var(--rule);padding-bottom:0}
  .tbl td{display:block;border-top:0}
  .bar .tabs .tab.opt{display:none}
}
.srcm{display:none}
@media (prefers-reduced-motion:reduce){#panel{transition:none}#next.pulse{animation:none}.prog i{transition:none}}
</style>
<script>try{var t=localStorage.getItem("mpc-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>

<div class="prog" aria-hidden="true"><i id="progI"></i></div>

  else if(view==="fit"){showOn=false;if(COMM&&COMM.id!==c.id){COMM=null;}renderFit(c);window.scrollTo(0,0);}
  else{const same=COMM&&COMM.id===c.id;if(!same){COMM=c;STEPS=stepsFor(c);LAST=STEPS.length-1;SCN={};fitCache.clear();hzCur=null;cur=0;}
    const wasOn=showOn;showOn=true;resize();if(!wasOn||!same||step!==cur)setStep(Math.min(step,LAST),step>=cur?1:-1,!wasOn||!same);}
}
window.addEventListener("hashchange",()=>{if(location.hash===lastHash)return;lastHash=location.hash;route();});

function retheme(){readTokens();requestDraw();if(!fitEl.hidden)redrawThumbs();}
if(window.matchMedia){const mq=window.matchMedia("(prefers-color-scheme: dark)");mq.addEventListener&&mq.addEventListener("change",()=>setTimeout(retheme,30));}
new MutationObserver(()=>setTimeout(retheme,30)).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme","class","style"]});
window.addEventListener("resize",()=>{if(showOn)resize();else if(!fitEl.hidden)redrawThumbs();});
readTokens();makeGrain();route();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{requestDraw();});
window.__show={go:(i)=>setStep(i,1,true),state:()=>({cur,done,elapsed,LAST,view:showOn,fromSite}),hits:()=>PLANHIT.filter(h=>!h.path).map(h=>({x:h.x,y:h.y,t:h.target}))};
})();
</script>
