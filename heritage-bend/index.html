  const sub=document.getElementById("brandSub");sub.textContent=MODE==="internal"&&view==="home"?"Internal":(c?firmOf(c).name:"");
  const mi=document.querySelector(".mark i");if(mi&&!REDUCE){mi.classList.remove("beat");void mi.offsetWidth;mi.classList.add("beat");}}
function placeBead(){const vb=tabsEl.querySelector(".vbead"),on=tabsEl.querySelector('a[aria-current="page"]');if(!vb)return;
  if(!on||!on.offsetWidth){vb.style.width="0";return;}vb.style.width=on.offsetWidth+"px";vb.style.transform="translateX("+on.offsetLeft+"px)";}
function route(){
  const h=(location.hash||"").replace(/^#/,"");
  let view="home",c=null,step=0;
  if(MODE!=="internal"){c=COMMS[0];if(/\.(fit|brief)$/.test(h))view="fit";else{view="show";const m=/\.s(\d+)$/.exec(h);step=m?+m[1]:0;}}
  else if(h&&h!=="home"){const [id,rest]=h.split(".");c=COMMS.find(x=>x.id===id);if(c){if(rest==="fit"||rest==="brief")view="fit";else{view="show";const m=/^s(\d+)$/.exec(rest||"s0");step=m?+m[1]:0;}}}
  homeEl.hidden=view!=="home";fitEl.hidden=view!=="fit";showEl.hidden=view!=="show";
  document.body.classList.toggle("showing",view==="show");tabsFor(view,c);
  document.getElementById("brand").setAttribute("href",MODE==="internal"?"#home":"#"+(c?c.id+".s0":""));
  if(view==="home"){showOn=false;renderHome();window.scrollTo(0,0);document.title=DATA.title;}
  else if(view==="fit"){showOn=false;if(COMM&&COMM.id!==c.id){COMM=null;}renderFit(c);window.scrollTo(0,0);}
  else{const same=COMM&&COMM.id===c.id;if(!same){COMM=c;STEPS=stepsFor(c);LAST=STEPS.length-1;SCN={};fitCache.clear();hzCur=null;cur=0;}
    const wasOn=showOn;showOn=true;resize();if(!wasOn||!same||step!==cur)setStep(Math.min(step,LAST),step>=cur?1:-1,!wasOn||!same);}
}
window.addEventListener("hashchange",()=>{if(location.hash===lastHash)return;lastHash=location.hash;route();});

function retheme(){readTokens();requestDraw();if(!fitEl.hidden)redrawThumbs();}
if(window.matchMedia){const mq=window.matchMedia("(prefers-color-scheme: dark)");mq.addEventListener&&mq.addEventListener("change",()=>setTimeout(retheme,30));}
new MutationObserver(()=>setTimeout(retheme,30)).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme","class","style"]});
window.addEventListener("resize",()=>{placeBead();if(showOn)resize();else if(!fitEl.hidden)redrawThumbs();});
readTokens();makeGrain();route();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{placeBead();requestDraw();});
window.__show={go:(i)=>setStep(i,1,true),state:()=>({cur,done,elapsed,LAST,view:showOn,fromSite}),hits:()=>PLANHIT.filter(h=>!h.path).map(h=>({x:h.x,y:h.y,t:h.target}))};
})();
</script>
